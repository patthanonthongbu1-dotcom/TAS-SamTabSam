# Netlify config for tas-33.netlify.app
#
# This lives in web/ because the site's base directory is set to "web" in
# the Netlify UI — with a base directory set, Netlify reads netlify.toml
# from there, not from the repo root.
#
# Deliberately no [build] section: publish directory, functions directory
# and build command are all configured in the Netlify UI and the defaults
# are already right (publish = the base dir, functions = netlify/functions
# inside it). Adding them here would silently override the UI.

# Short links: /r/<code> is served by the redirect function, which does the
# Firestore lookup and issues its own 302. status 200 (a rewrite) keeps the
# pretty URL in the address bar until the function redirects.
[[redirects]]
  from = "/r/*"
  to = "/.netlify/functions/redirect/:splat"
  status = 200
  force = true

# The daily "due today / tomorrow" reminder. It lives here rather than in
# Cloud Functions because scheduled functions come with the free plan and
# Firebase's don't — see the header of reminder.js.
#
# Every quarter hour, not once a day: everyone picks their own reminder
# time in Settings, so the function wakes up regularly and sends to
# whoever's minute has just passed. TICK_MINUTES in reminder.js has to
# match this interval, or a chosen time falls between two runs and is
# never reached.
#
# Scheduled functions are not reachable over HTTP in production; to try
# one, use `netlify functions:invoke reminder` locally.
[functions."reminder"]
  schedule = "*/15 * * * *"
