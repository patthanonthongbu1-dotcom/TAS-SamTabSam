<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAS · Task Formatter</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
    // Force external browser if opened in LINE
    (function() {
      if (/Line\//i.test(navigator.userAgent || '')) {
        const url = location.href;
        if (!url.includes('openExternalBrowser=1')) {
          location.replace(url + (url.includes('?') ? '&' : '?') + 'openExternalBrowser=1');
        }
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    /* No visible scrollbars anywhere — scrolling still works via wheel/touch */
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { display: none; }
    :root {
      --navy: #182848; --navy-dark: #0d1526; --navy-mid: #2f6fed;
      --pink: #ff4fa3; --pink-dark: #8e1c63; --pink-soft: #ffd6ea;
      --glass: rgba(255,255,255,0.06);
      --glass-2: rgba(255,255,255,0.04);
      --glass-brd: rgba(255,255,255,0.12);
      --field-bg: rgba(255,255,255,0.07);
      --field-brd: rgba(255,255,255,0.16);
      --text: #ffffff; --muted: rgba(255,255,255,0.62); --label: rgba(255,255,255,0.45);
      --red: #ff9b8a; --amber: #fde68a; --blue: #a9c8ff; --orange: #fdba74; --green: #6fe3bd;
    }
    /* One seamless backdrop — fixed gradient, dark html fallback for overscroll */
    html { min-height: 100%; background: var(--navy-dark); }
    body {
      font-family: 'Kanit', sans-serif;
      min-height: 100vh; min-height: 100dvh;
      color: var(--text);
      background: linear-gradient(160deg, #1c2f56 0%, var(--navy) 40%, var(--navy-dark) 100%) fixed;
      background-size: 200% 200%;
      animation: bgShift 24s ease-in-out infinite alternate;
      display: flex; justify-content: center;
      padding: 2.5rem 1rem 4rem;
      position: relative; overflow-x: hidden;
    }
    @keyframes bgShift { 0% { background-position: 0% 0%; } 100% { background-position: 100% 100%; } }

    /* ── Animated orb backdrop (matches index.html) ─────────────── */
    .bg-orbs { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    .orb { position: absolute; border-radius: 50%; filter: blur(70px); will-change: transform; }
    .orb-1 { width: 380px; height: 380px; top: -100px; left: -80px;
             background: radial-gradient(circle at 50% 50%, rgba(47,111,237,0.5), transparent 70%);
             animation: drift1 20s ease-in-out infinite; }
    .orb-2 { width: 320px; height: 320px; bottom: -120px; right: -90px;
             background: radial-gradient(circle at 50% 50%, rgba(255,79,163,0.4), transparent 70%);
             animation: drift2 24s ease-in-out infinite; }
    .orb-3 { width: 260px; height: 260px; top: 45%; left: 60%;
             background: radial-gradient(circle at 50% 50%, rgba(214,117,177,0.34), transparent 70%);
             animation: drift3 28s ease-in-out infinite; }
    @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(46px,54px) scale(1.08); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-52px,-40px) scale(1.1); } }
    @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-38px,44px) scale(0.92); } }

    /* ── Skeleton loading gate ──────────────────────────────────── */
    #authGate {
      position: fixed; inset: 0; z-index: 50;
      display: flex; justify-content: center;
      padding: 2.5rem 1rem; overflow: auto;
      background: linear-gradient(160deg, #1c2f56 0%, var(--navy) 40%, var(--navy-dark) 100%);
    }
    .skeleton-wrap { width: 100%; max-width: 600px; position: relative; z-index: 1; }
    .skel {
      background: linear-gradient(100deg, rgba(255,255,255,0.05) 30%, rgba(255,255,255,0.14) 50%, rgba(255,255,255,0.05) 70%);
      background-size: 200% 100%; animation: shimmer 1.3s linear infinite; border-radius: 10px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.75rem; gap: 12px; }
    .skel-logo { width: 62px; height: 62px; border-radius: 16px; }
    .skel-line { height: 12px; }
    .skel-pill { width: 118px; height: 40px; border-radius: 20px; flex-shrink: 0; }
    .skel-card { width: 100%; border-radius: 20px; margin-bottom: 1rem; }
    .gate-note { text-align: center; color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 1.5rem; letter-spacing: 0.02em; }

    /* ── Layout ─────────────────────────────────────────────────── */
    .container { width: 100%; max-width: 600px; position: relative; z-index: 1; }
    .header { margin-bottom: 1.75rem; padding: 0 0.25rem; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .brand-mini { width: 46px; height: 46px; object-fit: contain; display: block; margin-bottom: 10px;
                  animation: logoGlow 4.5s ease-in-out infinite; }
    @keyframes logoGlow {
      0%, 100% { filter: drop-shadow(0 0 3px rgba(255,255,255,0.25)); }
      50%      { filter: drop-shadow(0 0 14px rgba(255,255,255,0.8)); }
    }
    .header-text h1 { font-size: 25px; font-weight: 700; letter-spacing: -0.3px; }
    .header-text p { font-size: 13px; color: var(--muted); margin-top: 4px; font-weight: 300; }

    /* ── Profile pill + dropdown (glassy) ───────────────────────── */
    .user-pill {
      display: none; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
      border-radius: 22px; padding: 5px 12px 5px 5px;
      font-size: 12px; font-weight: 500; color: #fff;
      cursor: pointer; transition: background 0.15s, transform 0.12s; position: relative; user-select: none;
    }
    .user-pill:hover { background: rgba(255,255,255,0.14); }
    .user-pill:active { transform: scale(0.98); }
    .user-pill.visible { display: flex; }
    .user-pill img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.25); flex-shrink: 0; }
    .user-pill-fallback { width: 28px; height: 28px; border-radius: 50%; background: var(--pink); color: white; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .user-dropdown {
      position: absolute; top: calc(100% + 8px); right: 0;
      background: rgba(18,27,48,0.97); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.14); border-radius: 14px;
      box-shadow: 0 18px 44px -12px rgba(0,0,0,0.7);
      padding: 8px; min-width: 210px; z-index: 1000; display: none; flex-direction: column; gap: 3px;
      animation: dropIn 0.18s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes dropIn { from { opacity:0; transform:translateY(-6px) scale(0.97); } to { opacity:1; transform:none; } }
    .user-dropdown.open { display: flex; }
    .user-dropdown-info { padding: 8px 10px 11px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 3px; }
    .user-dropdown-name { font-size: 13px; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-dropdown-email { font-size: 11px; color: var(--muted); font-weight: 300; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .user-dropdown-role { display: inline-block; margin-top: 6px; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--pink); border: 1px solid rgba(255,79,163,0.4); border-radius: 20px; padding: 2px 8px; }
    .user-dropdown-btn { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 9px; border: none; background: transparent; font-family: 'Kanit', sans-serif; font-size: 13px; color: rgba(255,255,255,0.85); cursor: pointer; transition: background 0.13s, color 0.13s; text-align: left; width: 100%; }
    .user-dropdown-btn.menu:hover { background: rgba(255,79,163,0.16); color: #ffc2e0; }
    .user-dropdown-btn.signout:hover { background: rgba(192,57,43,0.18); color: var(--red); }

    /* ── Glass card (the whole "body") ──────────────────────────── */
    .card {
      background: var(--glass); backdrop-filter: blur(16px) saturate(1.15); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-brd); border-radius: 20px; padding: 1.5rem 1.5rem 1.75rem; margin-bottom: 1rem;
      box-shadow: 0 20px 50px -22px rgba(0,0,0,0.6);
    }
    .section-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--label); margin-bottom: 14px; }
    .field { margin-bottom: 1.1rem; }
    .field:last-child { margin-bottom: 0; }
    .field > label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }

    input[type="text"], input[type="date"], textarea, select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--field-brd); border-radius: 10px;
      font-family: 'Kanit', sans-serif; font-weight: 400; color: #fff; background: var(--field-bg);
      outline: none; transition: border-color 0.15s, background 0.15s; font-size: max(16px, 14px);
    }
    input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.38); }
    input:focus, textarea:focus, select:focus { border-color: var(--pink); background: rgba(255,255,255,0.1); }
    input[type="date"] { color-scheme: dark; }
    select option { color: #1a1a1a; }
    textarea { resize: vertical; min-height: 110px; line-height: 1.6; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 360px) { .row { grid-template-columns: 1fr; } }

    /* ── Buttons ────────────────────────────────────────────────── */
    .btn {
      width: 100%; padding: 15px; font-size: 15px; font-weight: 600; font-family: 'Kanit', sans-serif;
      background: linear-gradient(180deg, #ff5fac 0%, #c02e7e 100%); color: white; border: none; border-radius: 14px;
      cursor: pointer; transition: filter 0.15s, transform 0.12s, box-shadow 0.15s; touch-action: manipulation;
      box-shadow: 0 12px 28px -10px rgba(255,79,163,0.55);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover { filter: brightness(1.07); transform: translateY(-2px); box-shadow: 0 18px 34px -12px rgba(255,79,163,0.6); }
    .btn:active { transform: translateY(0) scale(0.99); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
    .task-count-badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 20px; background: rgba(255,255,255,0.25); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }

    .action-btn {
      display: inline-flex; align-items: center; gap: 5px; padding: 8px 12px; font-size: 12px; font-weight: 500;
      font-family: 'Kanit', sans-serif; border-radius: 9px; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85);
      cursor: pointer; transition: background 0.15s, border-color 0.15s; white-space: nowrap; touch-action: manipulation; min-height: 36px;
    }
    .action-btn:hover { background: rgba(255,255,255,0.15); }
    .btn-add-blue { background: rgba(47,111,237,0.18); color: var(--blue); border-color: rgba(47,111,237,0.36); }
    .btn-add-blue:hover { background: rgba(47,111,237,0.28); }
    .btn-delete { background: rgba(192,57,43,0.16); color: var(--red); border-color: rgba(192,57,43,0.34); }
    .btn-delete:hover { background: rgba(192,57,43,0.26); }
    .btn-delete.icon-only { padding: 0; width: 34px; min-height: 34px; justify-content: center; }
    .btn-toggle-note { background: rgba(234,179,8,0.14); color: var(--amber); border-color: rgba(234,179,8,0.32); }
    .btn-copy { background: rgba(255,255,255,0.1); color: #fff; gap: 6px; transition: background 0.2s, color 0.2s, border-color 0.2s; }
    .btn-copy .ico-check { display: none; }
    .btn-copy.copied { background: rgba(29,158,117,0.2); color: var(--green); border-color: rgba(29,158,117,0.42); }
    .btn-copy.copied .ico-clip { display: none; }
    .btn-copy.copied .ico-check { display: inline-flex; animation: popCheck 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes popCheck { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    /* Distinct hierarchy: SECTION (top, dashed, full-width) vs SUBJECT (nested chip) */
    .btn-add-section {
      width: 100%; justify-content: center; gap: 7px; display: inline-flex; align-items: center;
      padding: 13px; min-height: 46px; margin-bottom: 0.5rem;
      border: 1.5px dashed rgba(255,79,163,0.42); border-radius: 13px;
      background: rgba(255,79,163,0.08); color: #ffc2e0;
      font-family: 'Kanit', sans-serif; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.12s; touch-action: manipulation;
    }
    .btn-add-section:hover { background: rgba(255,79,163,0.16); border-color: rgba(255,79,163,0.7); }
    .btn-add-section:active { transform: scale(0.995); }
    .btn-add-subject {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; min-height: 36px; border-radius: 9px;
      background: rgba(47,111,237,0.18); color: var(--blue); border: 1px solid rgba(47,111,237,0.36);
      font-family: 'Kanit', sans-serif; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: background 0.15s; touch-action: manipulation;
    }
    .btn-add-subject:hover { background: rgba(47,111,237,0.28); }

    /* ── Status + save indicator ────────────────────────────────── */
    .status { margin-top: 1rem; padding: 12px 16px; border-radius: 12px; font-size: 13px; text-align: center; display: none; font-weight: 400; line-height: 1.5; }
    .s-success { background: rgba(29,158,117,0.2); color: var(--green); display: block; }
    .s-error { background: rgba(192,57,43,0.22); color: var(--red); display: block; }
    .s-info { background: rgba(255,255,255,0.09); color: rgba(255,255,255,0.82); display: block; }
    .save-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--label); font-weight: 400; padding: 4px 10px; border-radius: 20px; transition: color 0.3s, background 0.3s; }
    .save-indicator.saved { color: var(--green); background: rgba(29,158,117,0.16); }
    .save-indicator.saving { color: var(--amber); background: rgba(234,179,8,0.14); }
    .save-indicator-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .save-indicator.saving .save-indicator-dot { animation: savePulse 0.6s ease-in-out infinite alternate; }
    @keyframes savePulse { to { opacity: 0.3; } }
    .fb-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .fb-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--label); flex-shrink: 0; transition: background 0.3s; }
    .fb-dot.ready { background: var(--green); }
    .fb-dot.error { background: var(--red); }

    /* ── Section / subject / bullet blocks (with hierarchy) ─────── */
    /* No overflow:hidden here — that used to clip the "+ Add" dropdown.
       The header corners are rounded directly instead. */
    .section-block { border: 1px solid rgba(255,255,255,0.1); border-left: 3px solid rgba(255,79,163,0.5); border-radius: 14px; margin-bottom: 12px; background: var(--glass-2); }
    .section-header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1); border-radius: 13px 13px 0 0; }
    .icon-select { width: 54px !important; flex-shrink: 0; padding: 7px 2px !important; font-size: 17px !important; text-align: center; border-radius: 9px !important; }
    .section-title-input { flex: 1; font-size: 14px !important; font-weight: 500 !important; min-width: 0; }
    .section-body { padding: 12px 14px; }
    /* Nested one level in, with a left guide rail */
    .subject-block { padding: 12px 0 12px 12px; border-top: 1px dashed rgba(255,255,255,0.12); border-left: 2px solid rgba(255,255,255,0.09); margin: 2px 0 0 2px; }
    .subject-block:first-child { border-top: none; padding-top: 4px; margin-top: 0; }
    .subject-row { display: flex; align-items: flex-start; gap: 8px; }
    .subject-num { font-size: 12px; font-weight: 600; color: var(--label); min-width: 18px; padding-top: 11px; text-align: right; flex-shrink: 0; }
    .subject-body { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .subject-top { display: flex; align-items: center; gap: 6px; }
    .work-icon-select { width: 50px !important; flex-shrink: 0; padding: 7px 2px !important; font-size: 15px !important; text-align: center; border-radius: 9px !important; }
    .subject-title-input { flex: 1; font-size: 13px !important; min-width: 0; }

    /* ── Calendar-task fields (pink accent) ─────────────────────── */
    .task-fields { background: rgba(255,79,163,0.1); border: 1px solid rgba(255,79,163,0.28); border-radius: 10px; padding: 11px 12px; display: flex; flex-direction: column; gap: 8px; }
    .task-fields-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #ffb3d6; margin-bottom: 2px; }
    .task-fields input, .task-fields select { font-size: 13px !important; padding: 7px 10px !important; border-color: rgba(255,79,163,0.32) !important; background: rgba(255,255,255,0.06) !important; }
    .task-fields input:focus, .task-fields select:focus { border-color: var(--pink) !important; }
    .task-fields-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .task-fields .field { margin-bottom: 0; }
    .task-fields .field > label { font-size: 11px; color: #ffb3d6; }

    /* ── Bullets + per-bullet marker (orange accent) ────────────── */
    .bullet-list { display: flex; flex-direction: column; gap: 6px; }
    .bullet-block { display: flex; flex-direction: column; gap: 6px; }
    .bullet-row { display: flex; align-items: center; gap: 6px; }
    .bullet-dash { color: var(--label); font-size: 13px; flex-shrink: 0; padding-left: 2px; }
    .bullet-row input { flex: 1; font-size: 13px !important; padding: 7px 10px !important; min-width: 0; background: rgba(255,255,255,0.14) !important; border-color: rgba(255,255,255,0.22) !important; }
    .bullet-row input:focus { background: rgba(255,255,255,0.2) !important; border-color: var(--pink) !important; }
    .bullet-marker-btn {
      display: inline-flex; align-items: center; gap: 4px; padding: 5px 9px; font-size: 11px; font-weight: 500;
      font-family: 'Kanit', sans-serif; border-radius: 7px; cursor: pointer; white-space: nowrap; touch-action: manipulation;
      background: rgba(234,88,12,0.15); color: var(--orange); border: 1px solid rgba(251,146,60,0.32);
      transition: background 0.15s; flex-shrink: 0;
    }
    .bullet-marker-btn.active { background: #ea580c; color: white; border-color: #ea580c; }
    .bullet-marker-btn:hover { filter: brightness(1.08); }
    .bullet-marker-fields { margin-left: 28px; background: rgba(234,88,12,0.12); border: 1px solid rgba(251,146,60,0.3); border-radius: 9px; padding: 10px 11px; display: flex; flex-direction: column; gap: 8px; }
    .bullet-marker-fields-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--orange); }
    .bullet-marker-fields input { font-size: 13px !important; padding: 7px 10px !important; border-color: rgba(251,146,60,0.32) !important; background: rgba(255,255,255,0.06) !important; }
    .bullet-marker-fields input:focus { border-color: #ea580c !important; }
    .marker-type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .marker-type-btn { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 8px 10px; border: 1.5px solid rgba(251,146,60,0.3); border-radius: 8px; background: rgba(255,255,255,0.05); font-family: 'Kanit', sans-serif; font-size: 12px; font-weight: 400; color: rgba(255,255,255,0.72); cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .marker-type-btn.active { background: #ea580c; color: white; border-color: #ea580c; font-weight: 500; }

    /* ── Note (amber accent) ────────────────────────────────────── */
    .note-field { display: none; }
    .note-field.visible { display: block; }
    .note-input { font-size: 13px !important; padding: 8px 11px !important; border-color: rgba(234,179,8,0.32) !important; background: rgba(234,179,8,0.1) !important; color: var(--amber) !important; }
    .subject-actions { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-top: 4px; }

    /* ── "+ Add" dropdown (per subject) — NOT clipped by parents ─── */
    .add-dd { position: relative; display: inline-flex; }
    .add-dd-btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; min-height: 36px;
      border-radius: 9px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
      color: #fff; font-family: 'Kanit', sans-serif; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: background 0.15s; touch-action: manipulation;
    }
    .add-dd-btn:hover { background: rgba(255,255,255,0.15); }
    .add-dd-btn .caret { font-size: 9px; opacity: 0.6; transition: transform 0.2s ease; }
    .add-dd-btn.open .caret { transform: rotate(180deg); }
    .add-dd-menu {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 100;
      display: none; flex-direction: column; gap: 2px; min-width: 200px; padding: 6px;
      background: rgba(16,25,44,0.99); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.16); border-radius: 12px;
      box-shadow: 0 18px 44px -10px rgba(0,0,0,0.75); transform-origin: top left;
    }
    .add-dd-menu.up { top: auto; bottom: calc(100% + 6px); transform-origin: bottom left; }

    @keyframes menuExpand { from { opacity: 0; transform: scale(0.9) translateY(-5px); } to { opacity: 1; transform: none; } }
    .add-dd-item {
      display: flex; align-items: center; gap: 9px; padding: 9px 11px; border: none; border-radius: 8px;

    .add-dd-item.bullet:hover { background: rgba(47,111,237,0.18); color: var(--blue); }
    .add-dd-item.note:hover   { background: rgba(234,179,8,0.14); color: var(--amber); }
    .add-dd-item.cal:hover    { background: rgba(255,79,163,0.16); color: #ffc2e0; }
    .add-dd-item.active { color: #ffc2e0; }

    /* ── Preview ────────────────────────────────────────────────── */
    .preview-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 10px; }
    .preview-head .section-label { margin-bottom: 0; }
    .link-toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

      display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 12px; font-weight: 500;
      font-family: 'Kanit', sans-serif; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06); color: var(--label);
      cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s; touch-action: manipulation;
    }
    .link-chip:hover { background: rgba(255,255,255,0.12); }
    .link-chip .chip-check { display: none; font-weight: 600; }
    .link-chip.active { background: rgba(255,79,163,0.16); border-color: rgba(255,79,163,0.42); color: var(--pink-soft); }
    .link-chip.active .chip-check { display: inline; }
    .preview-box { background: rgba(0,0,0,0.24); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 1rem 1.1rem; font-size: 13px; line-height: 1.9; white-space: pre-wrap; color: rgba(255,255,255,0.9); font-family: 'Kanit', sans-serif; font-weight: 300; min-height: 80px; word-break: break-word; }
    .divider { height: 1px; background: rgba(255,255,255,0.1); margin: 1.35rem 0; }

    /* ── Merged footer (lives INSIDE the card / body) ───────────── */
    .footer-row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-bottom: 12px; }
    .empty-hint { text-align: center; color: var(--label); font-size: 12px; font-weight: 300; padding: 18px 12px; border: 1px dashed rgba(255,255,255,0.12); border-radius: 12px; margin-bottom: 10px; }

    /* ── Box add / remove animations ────────────────────────────── */
    @keyframes boxIn { from { opacity: 0; transform: translateY(-8px) scale(0.985); } to { opacity: 1; transform: none; } }
    .box-enter { animation: boxIn 0.28s cubic-bezier(0.34,1.4,0.64,1) both; }
    .box-removing {
      overflow: hidden !important;
      opacity: 0; transform: translateX(-8px);
      margin-top: 0 !important; margin-bottom: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important;
      transition: max-height 0.26s ease, opacity 0.2s ease, transform 0.2s ease, margin 0.26s ease, padding 0.26s ease;
    }
    /* Accent panels animate ONLY the freshly-toggled one (via .just-opened);
       NOT via a blanket rule — otherwise every re-render replays them (blink). */
    .just-opened { animation: expandIn 0.2s ease both; transform-origin: top; }
    @keyframes expandIn { from { opacity: 0; transform: scaleY(0.85) translateY(-4px); } to { opacity: 1; transform: none; } }

    /* ── Modals (confirm + tour) with expand / shrink ───────────── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 3000; display: none; align-items: center; justify-content: center;
      padding: 1.5rem; background: rgba(5,10,22,0.62); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    }
    .modal-overlay.open { display: flex; animation: overlayIn 0.16s ease; }
    .modal-overlay.closing { animation: overlayOut 0.16s ease forwards; }
    @keyframes overlayIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes overlayOut { to { opacity: 0; } }
    .modal {
      width: 100%; max-width: 370px; position: relative;
      background: rgba(20,30,54,0.98); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.14); border-radius: 22px; padding: 1.75rem 1.6rem 1.5rem;
      box-shadow: 0 34px 80px -24px rgba(0,0,0,0.85); text-align: center;
    }
    .modal-overlay.open .modal    { animation: modalExpand 0.24s cubic-bezier(0.34,1.56,0.64,1); }
    .modal-overlay.closing .modal { animation: modalShrink 0.16s ease forwards; }
    @keyframes modalExpand { from { opacity: 0; transform: scale(0.82) translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes modalShrink { to { opacity: 0; transform: scale(0.9); } }
    .confirm-icon { font-size: 36px; margin-bottom: 8px; }
    .confirm-title { font-size: 18px; font-weight: 600; color: #fff; margin-bottom: 6px; }
    .confirm-msg { font-size: 13px; font-weight: 300; color: var(--muted); line-height: 1.55; margin-bottom: 1.4rem; }
    .confirm-actions, .tour-actions { display: flex; gap: 10px; }
    .btn-ghost, .btn-solid {
      flex: 1; padding: 12px; border-radius: 11px; font-family: 'Kanit', sans-serif; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: background 0.15s, filter 0.15s, transform 0.1s; touch-action: manipulation; border: none;
    }
    .btn-ghost { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); color: rgba(255,255,255,0.85); }
    .btn-ghost:hover { background: rgba(255,255,255,0.15); }
    .btn-solid { background: linear-gradient(180deg, #ff5fac 0%, #c02e7e 100%); color: #fff; box-shadow: 0 10px 24px -10px rgba(255,79,163,0.55); }
    .btn-solid:hover { filter: brightness(1.07); }
    .btn-solid:active, .btn-ghost:active { transform: scale(0.98); }
    .btn-solid.danger { background: linear-gradient(180deg, #e05a4a 0%, #a52a1e 100%); box-shadow: 0 10px 24px -10px rgba(192,57,43,0.55); }
    .tour-close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 9px; background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); cursor: pointer; transition: background 0.15s, color 0.15s; }
    .tour-close:hover { background: rgba(255,255,255,0.14); color: #fff; }
    .tour-emoji { font-size: 42px; margin-bottom: 10px; }

    .tour-text { font-size: 13px; font-weight: 300; color: var(--muted); line-height: 1.6; min-height: 66px; }
    .tour-body.step-anim { animation: stepIn 0.24s ease; }
    @keyframes stepIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
    .tour-dots { display: flex; justify-content: center; gap: 7px; margin: 1.1rem 0 1.3rem; }
    .tour-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.2); transition: background 0.2s, width 0.2s; }
    .tour-dot.active { background: var(--pink); width: 20px; border-radius: 20px; }
    .tour-back:disabled { opacity: 0.4; cursor: not-allowed; }

    @media (max-width: 480px) {
      body { padding: 1.5rem 0.85rem 3rem; }
      .header { margin-bottom: 1.35rem; }
      .header-text h1 { font-size: 22px; }
      .card { padding: 1.15rem 1.15rem 1.5rem; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }

</head>

<div class="bg-orbs" aria-hidden="true">

<!-- ── Skeleton loading gate ──────────────────────────────────── -->

<!-- ── Confirmation modal ─────────────────────────────────────── -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js"
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js"
import { getFirestore, collection, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js"

const firebaseConfig = {
  apiKey: "AIzaSyA7jTnrA4qvIyqJRec3LYRgkIpJ4lKqX18",
  authDomain: "tas-samtabsam.firebaseapp.com",
  projectId: "tas-samtabsam",
  storageBucket: "tas-samtabsam.firebasestorage.app",
  messagingSenderId: "645483732924",
  appId: "1:645483732924:web:5a1ec2b9f7c58a18c655b9"
}

const MOD_PASSWORD_HASH = "4710ce735963a78ed12d2348a6ddd4e45a0f75cce94d78b3d81d077274e8c8fa"
const LOGIN_URL = "index.html"

const app  = initializeApp(firebaseConfig)
const auth = getAuth(app)
let db = null, fbReady = false

try { db = getFirestore(app); fbReady = true } catch(e) {}

function setFbStatus(ok) {
  const dot = document.getElementById("fbDot"), txt = document.getElementById("fbStatusText")
  if (!dot) return
  dot.className = "fb-dot " + (ok ? "ready" : "error")
  txt.textContent = ok ? "Calendar connected" : "Connection error"
}

async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str))
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("")
}

async function fetchWhitelist() {
  if (!db) return []
  try {
    const snap = await getDoc(doc(db, "config", "modWhitelist"))
    if (!snap.exists()) return []
    return (snap.data().emails || []).map(e => e.toLowerCase())
  } catch(e) { return [] }
}

let pendingUser = null

function showPasswordPrompt(user) {
  document.getElementById("authGate").innerHTML = `
    <div style="margin:auto;width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1;">
      <div style="font-size:34px;margin-bottom:2px">🔐</div>
      <div style="font-size:17px;font-weight:600;color:#fff;">Password required</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.6);font-weight:300;margin-bottom:18px;text-align:center;max-width:270px;line-height:1.5">
        Your account isn't on the whitelist.<br>Enter the panel password to continue.
      </div>
      <div style="width:100%;display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:9px 12px;">
          <img src="${user.photoURL || ''}" onerror="this.style.display='none'" style="width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;" />
          <div style="min-width:0;">
            <div style="font-size:12px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${user.displayName || user.email}</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.55);font-weight:300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${user.email}</div>
          </div>
        </div>
        <input type="password" id="gatePasswordInput" placeholder="Panel password"
          style="width:100%;padding:12px 14px;border:1.5px solid rgba(255,255,255,0.16);border-radius:11px;font-family:'Kanit',sans-serif;font-size:14px;outline:none;letter-spacing:2px;background:rgba(255,255,255,0.07);color:#fff;transition:border-color 0.15s;"
          onkeydown="if(event.key==='Enter')window._submitGatePassword()"
          onfocus="this.style.borderColor='#ff4fa3'" onblur="this.style.borderColor='rgba(255,255,255,0.16)'" />
        <div id="gatePasswordError" style="display:none;font-size:12px;color:#ff9b8a;text-align:center;padding:7px 10px;background:rgba(192,57,43,0.2);border-radius:9px;">❌ Incorrect password</div>
        <button id="gatePasswordBtn" onclick="window._submitGatePassword()"
          style="width:100%;padding:13px;background:linear-gradient(180deg,#ff5fac,#c02e7e);color:white;border:none;border-radius:11px;font-family:'Kanit',sans-serif;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 12px 26px -10px rgba(255,79,163,0.55);">
          Enter Panel
        </button>
        <button onclick="window._cancelGatePassword()"
          style="background:none;border:none;font-family:'Kanit',sans-serif;font-size:12px;color:rgba(255,255,255,0.5);cursor:pointer;padding:5px;">
          ← Use a different account
        </button>
      </div>
    </div>`
  setTimeout(() => document.getElementById("gatePasswordInput")?.focus(), 80)
}

window._submitGatePassword = async function() {
  const input = document.getElementById("gatePasswordInput")
  const btn   = document.getElementById("gatePasswordBtn")
  const err   = document.getElementById("gatePasswordError")
  if (!input || !pendingUser) return
  btn.textContent = "Checking..."; btn.disabled = true; err.style.display = "none"
  const hash = await sha256(input.value)
  if (hash === MOD_PASSWORD_HASH) {
    revealApp(pendingUser)
  } else {
    err.style.display = "block"; input.value = ""; input.focus()
    btn.textContent = "Enter Panel"; btn.disabled = false
  }
}
window._cancelGatePassword = async function() { await signOut(auth); window.location.href = LOGIN_URL }

function revealApp(user) {
  document.getElementById("authGate").style.display = "none"
  document.getElementById("mainContent").style.display = "block"
  fbReady = true; setFbStatus(!!db); renderUserPill(user); initApp()
  // First-time visitors get the walkthrough automatically.
  try { if (!localStorage.getItem("tas_tour_seen")) setTimeout(openTour, 550) } catch(e) {}
}

onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = LOGIN_URL; return }
  const whitelist = await fetchWhitelist()
  if (whitelist.includes(user.email.toLowerCase())) {
    revealApp(user)
  } else {
    pendingUser = user; showPasswordPrompt(user)
  }
})

function renderUserPill(user) {
  const pill = document.getElementById("userPill")
  const av   = document.getElementById("pillAvatar")
  const name = user.displayName || user.email
  document.getElementById("pillName").textContent = name.split(" ")[0]
  if (user.photoURL) { av.innerHTML = `<img src="${user.photoURL}" alt="" />` }
  else { const i = name.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2); av.innerHTML = `<div class="user-pill-fallback">${i}</div>` }
  pill.classList.add("visible")
  document.getElementById("dropdownName").textContent  = user.displayName || user.email
  document.getElementById("dropdownEmail").textContent = user.email
}

window.toggleUserDropdown = (e) => { e.stopPropagation(); document.getElementById("userDropdown").classList.toggle("open") }
document.addEventListener("click", () => {
  document.getElementById("userDropdown")?.classList.remove("open")
  document.querySelectorAll(".add-dd-menu.open").forEach(m => m.classList.remove("open"))
  document.querySelectorAll(".add-dd-btn.open").forEach(b => b.classList.remove("open"))
})
window.handleReturnToMenu = () => { window.location.href = LOGIN_URL }
window.handleSignOut = async () => { await signOut(auth); window.location.href = LOGIN_URL }

// ── Modals: confirm dialog + "How it works" tour ──────────────
function closeOverlay(ov) {
  ov.classList.add("closing")
  setTimeout(() => ov.classList.remove("open", "closing"), 160)
}
function openConfirm({ icon = "⚠️", title, message, okText = "Confirm", danger = true }) {
  return new Promise(resolve => {
    const ov = document.getElementById("confirmOverlay")
    document.getElementById("confirmIcon").textContent  = icon
    document.getElementById("confirmTitle").textContent = title
    document.getElementById("confirmMsg").textContent   = message
    const ok = document.getElementById("confirmOk"), cancel = document.getElementById("confirmCancel")
    ok.textContent = okText
    ok.className = "btn-solid" + (danger ? " danger" : "")
    ov.classList.add("open")
    const finish = (val) => { ok.onclick = cancel.onclick = ov.onclick = null; closeOverlay(ov); resolve(val) }
    ok.onclick     = () => finish(true)
    cancel.onclick = () => finish(false)
    ov.onclick     = (e) => { if (e.target === ov) finish(false) }
  })
}

const TOUR_STEPS = [
  { emoji:"📢", title:"Build your report",      text:"Start with a section for each category — homework, announcements, events. Tap “New section” to add one." },
  { emoji:"📝", title:"Add subjects & bullets", text:"Inside a section, add a subject, then use the “+ Add” menu on that subject to add bullet points or a note." },
  { emoji:"📍", title:"Flag calendar tasks",    text:"Turn items into calendar events: tap 📍 on a bullet to mark a quiz/exam/event, or “+ Add → Add to calendar” on a subject." },
  { emoji:"💾", title:"Save & copy",            text:"Hit “Save tasks to calendar” to push the flagged items to the shared calendar — or use the clipboard button to copy the formatted text." },
]
let tourIdx = 0
function renderTour() {
  const s = TOUR_STEPS[tourIdx]
  document.getElementById("tourEmoji").textContent = s.emoji
  document.getElementById("tourTitle").textContent = s.title
  document.getElementById("tourText").textContent  = s.text
  document.getElementById("tourDots").innerHTML = TOUR_STEPS.map((_, i) => `<span class="tour-dot${i===tourIdx?" active":""}"></span>`).join("")
  document.getElementById("tourBack").disabled = tourIdx === 0
  document.getElementById("tourNext").textContent = tourIdx === TOUR_STEPS.length - 1 ? "Got it!" : "Next"
  const body = document.querySelector(".tour-body")
  body.classList.remove("step-anim"); void body.offsetWidth; body.classList.add("step-anim")
}
function openTour() {
  tourIdx = 0; renderTour()
  document.getElementById("tourOverlay").classList.add("open")
  try { localStorage.setItem("tas_tour_seen", "1") } catch(e) {}
}
function closeTour() { closeOverlay(document.getElementById("tourOverlay")) }
window.handleHowItWorks = () => openTour()
document.getElementById("tourNext").onclick  = () => { if (tourIdx === TOUR_STEPS.length - 1) closeTour(); else { tourIdx++; renderTour() } }
document.getElementById("tourBack").onclick  = () => { if (tourIdx > 0) { tourIdx--; renderTour() } }
document.getElementById("tourClose").onclick = closeTour
document.getElementById("tourOverlay").onclick = (e) => { if (e.target.id === "tourOverlay") closeTour() }

// ── App logic ─────────────────────────────────────────────────
function initApp() {
  const SECTION_ICONS = ["📢","📚","💻","🎨","🔬","🏫","📌","🗓️"]
  const WORK_ICONS    = ["📝","💻","🔬","🎨","📚","🏃","🎵","📐","✏️"]
  const MARKER_TYPES  = [
    { key: "quiz",  label: "📝 Quiz" },
    { key: "exam",  label: "📋 Exam" },
    { key: "event", label: "🎉 Event" },
    { key: "date",  label: "📌 Important" },
  ]
  const STORAGE_KEY = "tas_fmt_draft_v4"
  const ICON_X    = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`
  const ICON_PLUS = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`
  const ICON_BULLET = `<svg viewBox="0 0 24 24" width="14" height="14"><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>`
  const ICON_NOTE   = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg>`
  const ICON_CAL    = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 3v4M16 3v4"/></svg>`

  let sections = []
  let saveTimer = null
  let pendingEnter = null   // { sel, cls } — the ONE element to animate after a render

  function setSaveIndicator(state) {
    const el = document.getElementById("saveIndicator")
    if (!el) return   // indicator was removed from the UI; drafts still save silently
    const txt = document.getElementById("saveIndicatorText")
    el.className = "save-indicator " + state
    if (txt) txt.textContent = state === "saving" ? "Saving…" : "Draft saved"
  }

  function saveDraft() {
    setSaveIndicator("saving")
    const draft = {
      date:     document.getElementById("fmtDate").value,
      reporter: document.getElementById("fmtReporter").value,
      links:    { ...linkPrefs },
      sections: JSON.parse(JSON.stringify(sections)),
    }
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(draft)) } catch(e) {}
    setSaveIndicator("saved")
  }

  function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveDraft, 600) }
  function loadDraft() { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null } catch(e) { return null } }
  function clearDraft() { try { localStorage.removeItem(STORAGE_KEY) } catch(e) {} }

  // ── Bullet helpers ────────────────────────────────────────────
  function makeBullet(text = "") {
    const today = new Date().toISOString().split("T")[0]
    return { text, markerMode: false, markerDate: today, markerType: "quiz" }
  }
  function normalizeBullet(b) {
    if (typeof b === "string") return makeBullet(b)
    return { text: b.text || "", markerMode: !!b.markerMode, markerDate: b.markerDate || new Date().toISOString().split("T")[0], markerType: b.markerType || "quiz" }
  }

  function restoreDraft(draft) {
    if (!draft) return
    if (draft.date)     document.getElementById("fmtDate").value     = draft.date
    if (draft.reporter) document.getElementById("fmtReporter").value = draft.reporter
    if (draft.links) {
      linkPrefs = { classroom: draft.links.classroom !== false, calendar: draft.links.calendar !== false }
      syncLinkChips()
    }
    if (draft.sections && draft.sections.length > 0) {
      sections = draft.sections.map(sec => ({
        ...sec,
        subjects: (sec.subjects || []).map(subj => ({
          ...subj,
          bullets: (subj.bullets || [""]).map(normalizeBullet)
        }))
      }))
      renderSections()
    } else {
      addSection()
    }
    updatePreview()
  }

  async function clearForm() {
    const ok = await openConfirm({ icon: "🧹", title: "Clear the whole form?", message: "Every section, subject and bullet will be wiped. This can't be undone.", okText: "Clear all" })
    if (!ok) return
    sections = []
    document.getElementById("fmtDate").value     = new Date().toISOString().split("T")[0]
    document.getElementById("fmtReporter").value = ""
    clearDraft(); setSaveIndicator("saved")
    addSection()
    updatePreview()
  }
  document.getElementById("clearBtn").onclick = clearForm

  function esc(str) { return (str||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;") }

  function thaiDate(dateStr) {
    if (!dateStr) return ""
    const months = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"]
    const d = new Date(dateStr + "T00:00:00")
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}`
  }

  function iconOpts(sel, icons) { return icons.map(ic => `<option value="${ic}"${ic===sel?" selected":""}>${ic}</option>`).join("") }

  // ── Structural add / remove (with box animations) ─────────────
  function addSection() {
    sections.push({ icon: "📢", title: "", subjects: [] })
    addSubject(sections.length - 1, false)
    pendingEnter = { sel: `.section-block[data-si="${sections.length - 1}"]`, cls: "box-enter" }
    renderSections()
  }
  async function removeSection(si) {
    const ok = await openConfirm({ icon: "🗑️", title: "Delete this section?", message: "The section and all of its subjects and bullets will be removed.", okText: "Delete" })
    if (!ok) return
    animateRemove(`.section-block[data-si="${si}"]`, () => {
      sections.splice(si, 1); renderSections(); scheduleSave()
    })
  }

  function addSubject(si, doRender = true) {
    const today = new Date().toISOString().split("T")[0]
    sections[si].subjects.push({
      icon: "📝", title: "", bullets: [makeBullet()], note: "", showNote: false,
      syncToCalendar: false, taskStart: today, taskEnd: "", taskType: "send_on",
    })
    if (doRender) { pendingEnter = { sel: `.subject-block[data-si="${si}"][data-sj="${sections[si].subjects.length - 1}"]`, cls: "box-enter" }; renderSections() }
  }
  async function removeSubject(si, sj) {
    const ok = await openConfirm({ icon: "🗑️", title: "Delete this subject?", message: "The subject and all of its bullets will be removed.", okText: "Delete" })
    if (!ok) return
    animateRemove(`.subject-block[data-si="${si}"][data-sj="${sj}"]`, () => {
      sections[si].subjects.splice(sj, 1); renderSections(); scheduleSave()
    })
  }

  function addBullet(si, sj) {
    sections[si].subjects[sj].bullets.push(makeBullet())
    pendingEnter = { sel: `.bullet-block[data-si="${si}"][data-sj="${sj}"][data-bk="${sections[si].subjects[sj].bullets.length - 1}"]`, cls: "box-enter" }
    renderSections()
  }
  function removeBullet(si, sj, bk) {
    if (sections[si].subjects[sj].bullets.length <= 1) return
    animateRemove(`.bullet-block[data-si="${si}"][data-sj="${sj}"][data-bk="${bk}"]`, () => {
      sections[si].subjects[sj].bullets.splice(bk, 1); renderSections(); scheduleSave()
    })
  }

  // Collapse an element out, then run the mutation + re-render
  function animateRemove(sel, done) {
    const el = document.querySelector(sel)
    if (!el) { done(); return }
    el.style.maxHeight = el.offsetHeight + "px"
    el.classList.add("box-removing")
    requestAnimationFrame(() => { el.style.maxHeight = "0px" })
    let called = false
    const finish = () => { if (called) return; called = true; done() }
    el.addEventListener("transitionend", (e) => { if (e.propertyName === "max-height") finish() })
    setTimeout(finish, 340)
  }

  function toggleNote(si, sj) {
    const nowOpen = !sections[si].subjects[sj].showNote
    sections[si].subjects[sj].showNote = nowOpen
    if (nowOpen) pendingEnter = { sel: `.subject-block[data-si="${si}"][data-sj="${sj}"] .note-field`, cls: "just-opened" }
    renderSections()
  }
  function toggleSync(si, sj) {
    const nowOn = !sections[si].subjects[sj].syncToCalendar
    sections[si].subjects[sj].syncToCalendar = nowOn
    if (nowOn) pendingEnter = { sel: `.subject-block[data-si="${si}"][data-sj="${sj}"] .task-fields`, cls: "just-opened" }
    renderSections(); scheduleSave()
  }
  function toggleBulletMarker(si, sj, bk) {
    const nowOn = !sections[si].subjects[sj].bullets[bk].markerMode
    sections[si].subjects[sj].bullets[bk].markerMode = nowOn
    if (nowOn) pendingEnter = { sel: `.bullet-block[data-si="${si}"][data-sj="${sj}"][data-bk="${bk}"] .bullet-marker-fields`, cls: "just-opened" }
    renderSections(); scheduleSave()
  }
  function setBulletMarkerType(si, sj, bk, type) {
    sections[si].subjects[sj].bullets[bk].markerType = type
    renderSections(); scheduleSave()
  }

  function renderSections() {
    const list = document.getElementById("sectionList")
    list.innerHTML = ""
    sections.forEach((sec, si) => {
      const div = document.createElement("div")
      div.className = "section-block"
      div.dataset.si = si

      const subjHTML = sec.subjects.map((subj, sj) => {
        const bulletsHTML = subj.bullets.map((b, bk) => {
          const isMarker = b.markerMode
          const markerTypeButtons = MARKER_TYPES.map(mt =>
            `<button class="marker-type-btn${b.markerType===mt.key?" active":""}"
              data-si="${si}" data-sj="${sj}" data-bk="${bk}" data-mtype="${mt.key}">${mt.label}</button>`
          ).join("")

          const markerPanel = isMarker ? `
            <div class="bullet-marker-fields">
              <div class="bullet-marker-fields-label">📍 Marker</div>
              <div style="display:flex;flex-direction:column;gap:6px;">
                <input type="date" value="${esc(b.markerDate)}" class="bullet-marker-date" data-si="${si}" data-sj="${sj}" data-bk="${bk}" />
                <div class="marker-type-grid">${markerTypeButtons}</div>
              </div>
            </div>` : ""

          return `
            <div class="bullet-block" data-si="${si}" data-sj="${sj}" data-bk="${bk}">
              <div class="bullet-row">
                <span class="bullet-dash">-</span>
                <input type="text" placeholder="Write bullet point..." value="${esc(b.text)}"
                  data-si="${si}" data-sj="${sj}" data-bk="${bk}" class="bullet-inp" />
                <button class="bullet-marker-btn${isMarker?" active":""} toggle-bullet-marker"
                  data-si="${si}" data-sj="${sj}" data-bk="${bk}" title="Toggle marker for this bullet">
                📍${isMarker?" ✓":""}
                </button>
                <button class="action-btn btn-delete icon-only rm-bullet" data-si="${si}" data-sj="${sj}" data-bk="${bk}" title="Remove bullet" aria-label="Remove bullet">${ICON_X}</button>
              </div>
              ${markerPanel}
            </div>`
        }).join("")

        const noteVisible = subj.showNote ? "visible" : ""
        const syncActive  = subj.syncToCalendar

        const calPanel = syncActive ? `
          <div class="task-fields">
            <div class="task-fields-label">📅 Calendar task</div>
            <div class="field">
              <label>Section (auto-filled)</label>
              <input type="text" value="${esc(sections[si].title || '(no section)')}" disabled style="opacity:0.6;cursor:not-allowed;" />
            </div>
            <div class="task-fields-row">
              <div class="field"><label>Start date</label>
                <input type="date" value="${esc(subj.taskStart)}" class="cal-start" data-si="${si}" data-sj="${sj}" />
              </div>
              <div class="field"><label>End / Due date</label>
                <input type="date" value="${esc(subj.taskEnd)}" class="cal-end" data-si="${si}" data-sj="${sj}" />
              </div>
            </div>
            <div class="field"><label>Type</label>
              <select class="cal-type" data-si="${si}" data-sj="${sj}">
                <option value="send_on"${subj.taskType==="send_on"?" selected":""}>🟢 Send on</option>
                <option value="send_before"${subj.taskType==="send_before"?" selected":""}>🔴 Send before</option>
                <option value="estimated"${subj.taskType==="estimated"?" selected":""}>🟡 Estimated</option>
              </select>
            </div>
          </div>` : ""

        return `
          <div class="subject-block" data-si="${si}" data-sj="${sj}">
            <div class="subject-row">
              <div class="subject-num">${sj+1}.</div>
              <div class="subject-body">
                <div class="subject-top">
                  <select class="work-icon-select subj-icon" data-si="${si}" data-sj="${sj}">${iconOpts(subj.icon,WORK_ICONS)}</select>
                  <input class="subject-title-input subj-title" type="text" placeholder="Subject name" value="${esc(subj.title)}"
                    data-si="${si}" data-sj="${sj}" />
                  <button class="action-btn btn-delete icon-only rm-subj" data-si="${si}" data-sj="${sj}" title="Remove subject" aria-label="Remove subject">${ICON_X}</button>
                </div>
                <div class="bullet-list">${bulletsHTML}</div>
                <div class="subject-actions">
                  <div class="add-dd">
                    <button class="add-dd-btn" data-si="${si}" data-sj="${sj}">${ICON_PLUS} Add <span class="caret">▾</span></button>
                    <div class="add-dd-menu">
                      <button class="add-dd-item bullet add-bullet" data-si="${si}" data-sj="${sj}"><span class="dd-ico">${ICON_BULLET}</span> Bullet point</button>
                      <button class="add-dd-item note toggle-note" data-si="${si}" data-sj="${sj}"><span class="dd-ico">${ICON_NOTE}</span> ${subj.showNote ? "Hide note" : "Note"}</button>
                      <button class="add-dd-item cal toggle-sync${syncActive?" active":""}" data-si="${si}" data-sj="${sj}"><span class="dd-ico">${ICON_CAL}</span> ${syncActive ? "Remove from calendar" : "Add to calendar"}${syncActive ? '<span class="dd-check">✓</span>' : ''}</button>
                    </div>
                  </div>
                </div>
                <div class="note-field ${noteVisible}">
                  <input class="note-input subj-note" type="text" placeholder="Write note here..." value="${esc(subj.note)}"
                    data-si="${si}" data-sj="${sj}" style="margin-top:6px;" />
                </div>
                ${calPanel}
              </div>
            </div>
          </div>`
      }).join("")

      div.innerHTML = `
        <div class="section-header">
          <select class="icon-select sec-icon" data-si="${si}">${iconOpts(sec.icon,SECTION_ICONS)}</select>
          <input class="section-title-input sec-title" type="text" placeholder="Section title e.g. การบ้าน"
            value="${esc(sec.title)}" data-si="${si}" />
          <button class="action-btn btn-delete rm-sec" data-si="${si}">${ICON_X} Section</button>
        </div>
        <div class="section-body">
          ${subjHTML}
          <div style="margin-top:${sec.subjects.length>0?"10px":"0"};">
            <button class="btn-add-subject add-subj" data-si="${si}">${ICON_PLUS} Add subject</button>
          </div>
        </div>`
      list.appendChild(div)
    })
    if (sections.length === 0) {
      list.innerHTML = `<div class="empty-hint">No sections yet — tap “New section” below to start.</div>`
    }
    updatePreview()
    bindSectionEvents()

    // Play the enter animation on the ONE element that just changed
    if (pendingEnter) {
      const el = document.querySelector(pendingEnter.sel)
      if (el) { const c = pendingEnter.cls; el.classList.add(c); el.addEventListener("animationend", () => el.classList.remove(c), { once: true }) }
      pendingEnter = null
    }
  }

  function bindSectionEvents() {
    const list = document.getElementById("sectionList")
    list.querySelectorAll(".sec-icon").forEach(el => { el.onchange = () => { sections[+el.dataset.si].icon = el.value; updatePreview(); scheduleSave() } })
    list.querySelectorAll(".sec-title").forEach(el => { el.oninput = () => { sections[+el.dataset.si].title = el.value; updatePreview(); scheduleSave() } })
    list.querySelectorAll(".rm-sec").forEach(el => { el.onclick = () => removeSection(+el.dataset.si) })
    list.querySelectorAll(".subj-icon").forEach(el => { el.onchange = () => { sections[+el.dataset.si].subjects[+el.dataset.sj].icon = el.value; updatePreview(); scheduleSave() } })
    list.querySelectorAll(".subj-title").forEach(el => { el.oninput = () => { sections[+el.dataset.si].subjects[+el.dataset.sj].title = el.value; updatePreview(); scheduleSave() } })
    list.querySelectorAll(".subj-note").forEach(el => { el.oninput = () => { sections[+el.dataset.si].subjects[+el.dataset.sj].note = el.value; updatePreview(); scheduleSave() } })
    list.querySelectorAll(".rm-subj").forEach(el => { el.onclick = () => removeSubject(+el.dataset.si, +el.dataset.sj) })
    list.querySelectorAll(".add-bullet").forEach(el => { el.onclick = () => addBullet(+el.dataset.si, +el.dataset.sj) })
    list.querySelectorAll(".toggle-note").forEach(el => { el.onclick = () => toggleNote(+el.dataset.si, +el.dataset.sj) })
    list.querySelectorAll(".toggle-sync").forEach(el => { el.onclick = () => toggleSync(+el.dataset.si, +el.dataset.sj) })
    list.querySelectorAll(".rm-bullet").forEach(el => { el.onclick = () => removeBullet(+el.dataset.si, +el.dataset.sj, +el.dataset.bk) })
    list.querySelectorAll(".bullet-inp").forEach(el => {
      el.oninput = () => { sections[+el.dataset.si].subjects[+el.dataset.sj].bullets[+el.dataset.bk].text = el.value; updatePreview(); scheduleSave() }
    })
    list.querySelectorAll(".toggle-bullet-marker").forEach(el => {
      el.onclick = () => toggleBulletMarker(+el.dataset.si, +el.dataset.sj, +el.dataset.bk)
    })
    list.querySelectorAll(".bullet-marker-date").forEach(el => {
      el.oninput = () => { sections[+el.dataset.si].subjects[+el.dataset.sj].bullets[+el.dataset.bk].markerDate = el.value; updatePreview(); scheduleSave() }
    })
    list.querySelectorAll(".marker-type-btn").forEach(el => {
      el.onclick = () => setBulletMarkerType(+el.dataset.si, +el.dataset.sj, +el.dataset.bk, el.dataset.mtype)
    })
    list.querySelectorAll(".add-subj").forEach(el => { el.onclick = () => addSubject(+el.dataset.si) })
    list.querySelectorAll(".cal-start").forEach(el => { el.oninput = () => { sections[+el.dataset.si].subjects[+el.dataset.sj].taskStart = el.value; updatePreview(); scheduleSave() } })
    list.querySelectorAll(".cal-end").forEach(el => { el.oninput = () => { sections[+el.dataset.si].subjects[+el.dataset.sj].taskEnd = el.value; scheduleSave() } })
    list.querySelectorAll(".cal-type").forEach(el => { el.onchange = () => { sections[+el.dataset.si].subjects[+el.dataset.sj].taskType = el.value; scheduleSave() } })

    // "+ Add" dropdown toggle — positioned so it escapes any parent clipping
    list.querySelectorAll(".add-dd-btn").forEach(el => {
      el.onclick = (e) => {
        e.stopPropagation()
        const menu = el.nextElementSibling
        const willOpen = !menu.classList.contains("open")
        list.querySelectorAll(".add-dd-menu.open").forEach(m => m.classList.remove("open"))
        list.querySelectorAll(".add-dd-btn.open").forEach(b => b.classList.remove("open"))
        menu.classList.remove("up")
        if (willOpen) {
          menu.classList.add("open"); el.classList.add("open")
          // flip upward if it would spill past the viewport bottom
          const r = menu.getBoundingClientRect()
          if (r.bottom > window.innerHeight - 8) menu.classList.add("up")
        }
      }
    })
  }

  document.getElementById("addSectionBtn").onclick = () => { addSection(); scheduleSave() }
  document.getElementById("fmtDate").oninput     = () => { updatePreview(); scheduleSave() }
  document.getElementById("fmtReporter").oninput = () => { updatePreview(); scheduleSave() }

  const LINK_CLASSROOM = "https://classroom.google.com"   // ← replace with the class's own Classroom link if you have one
  const LINK_CALENDAR  = "https://tas-33.netlify.app/calendar"
  let linkPrefs = { classroom: true, calendar: true }

  function syncLinkChips() {
    document.getElementById("lnkClassroom").classList.toggle("active", linkPrefs.classroom)
    document.getElementById("lnkCalendar").classList.toggle("active", linkPrefs.calendar)
  }
  document.getElementById("lnkClassroom").onclick = () => { linkPrefs.classroom = !linkPrefs.classroom; syncLinkChips(); updatePreview(); scheduleSave() }
  document.getElementById("lnkCalendar").onclick  = () => { linkPrefs.calendar  = !linkPrefs.calendar;  syncLinkChips(); updatePreview(); scheduleSave() }
  syncLinkChips()

  function buildFormattedMessage() {
    const date     = thaiDate(document.getElementById("fmtDate").value)
    const reporter = document.getElementById("fmtReporter").value.trim()
    let msg = date
    if (reporter) msg += `\n👤 ${reporter}`
    sections.forEach(sec => {
      msg += `\n\n${sec.icon} ${sec.title}`
      sec.subjects.forEach((subj, i) => {
        if (i > 0) msg += `\n`
        msg += `\n${i+1}. ${subj.icon} ${subj.title}`
        subj.bullets.forEach(b => { if (b.text.trim()) msg += `\n- ${b.text}` })
        if (subj.note.trim()) msg += `\n📌 ${subj.note}`
      })
    })
    msg = msg.trim()
    if (msg) {
      const links = []
      if (linkPrefs.classroom) links.push(`🔗 Google Classroom: ${LINK_CLASSROOM}`)
      if (linkPrefs.calendar)  links.push(`📅 Calendar: ${LINK_CALENDAR}`)
      if (links.length) msg += `\n\n${links.join("\n")}`
    }
    return msg
  }

  function updatePreview() {
    const msg = buildFormattedMessage() || "Fill in the form to see preview..."
    document.getElementById("preview").textContent = msg
    document.getElementById("taskCount").textContent = collectCalendarTasks().length
  }

  function collectCalendarTasks() {
    const tasks = []
    sections.forEach(sec => {
      sec.subjects.forEach(subj => {
        subj.bullets.forEach(b => {
          if (!b.markerMode || !b.text.trim()) return
          tasks.push({
            name:       subj.title.trim() || b.text.trim(),
            subject:    b.text.trim(),
            type:       "marker",
            markerType: b.markerType || "quiz",
            date:       b.markerDate,
            start:      b.markerDate,
            end:        b.markerDate,
            note:       subj.note.trim() || ""
          })
        })
        if (!subj.syncToCalendar) return
        const today      = new Date().toISOString().split("T")[0]
        const bulletNote = subj.bullets.filter(b=>b.text.trim()).map(b=>`- ${b.text}`).join("\n")
        const note       = subj.note.trim()
        tasks.push({
          name:    subj.title.trim() || "(no name)",
          subject: sec.title.trim() || "ไม่ระบุ",
          type:    subj.taskType || "send_on",
          start:   subj.taskStart || today,
          end:     subj.taskEnd || subj.taskStart || today,
          note:    note + (bulletNote ? (note ? "\n" : "") + bulletNote : "")
        })
      })
    })
    return tasks
  }

  async function syncToFirestore(tasks) {
    if (!fbReady || !db) throw new Error("Firebase not initialized")
    const results = []
    for (const task of tasks) {
      try { await addDoc(collection(db, "tasks"), { ...task, createdAt: Date.now() }); results.push({ ok: true, name: task.name }) }
      catch(e) { results.push({ ok: false, name: task.name, error: e.message }) }
    }
    return results
  }

  function setStatus(cls, text) {
    const el = document.getElementById("status")
    el.className = "status " + cls; el.style.display = "block"; el.textContent = text
  }

  // ── Copy formatted text (the "printer") ───────────────────────
  let copyResetTimer = null
  async function copyFormatted() {
    const msg = buildFormattedMessage()
    if (!msg) return false
    try {
      await navigator.clipboard.writeText(msg)
      const btn = document.getElementById("copyBtn")
      const lbl = btn.querySelector(".copy-label")
      btn.classList.add("copied")
      if (lbl) lbl.textContent = "Copied"
      clearTimeout(copyResetTimer)
      copyResetTimer = setTimeout(() => { btn.classList.remove("copied"); if (lbl) lbl.textContent = "Copy" }, 2000)
      return true
    } catch(e) { return false }
  }
  document.getElementById("copyBtn").onclick = async function() {
    if (!buildFormattedMessage()) { setStatus("s-info", "ℹ️ Nothing to copy yet."); return }
    const ok = await copyFormatted()
    if (!ok) setStatus("s-error", "Couldn't copy — select the preview text manually.")
  }

  // ── Save flagged tasks to Firestore ───────────────────────────
  document.getElementById("saveBtn").onclick = async function() {
    const btn = this
    const tasks = collectCalendarTasks()
    if (tasks.length === 0) {
      setStatus("s-info", "ℹ️ No tasks flagged yet. Toggle 📍 on a bullet, or + Add → Add to calendar on a subject.")
      return
    }
    const markers = tasks.filter(t => t.type === "marker")
    const normal  = tasks.filter(t => t.type !== "marker")
    const label   = markers.length && normal.length
      ? `${normal.length} task(s) + ${markers.length} marker(s)`
      : markers.length ? `${markers.length} marker(s)` : `${normal.length} task(s)`

    const ok = await openConfirm({ icon: "📅", title: "Save to calendar?", message: `This adds ${label} to the shared calendar and copies the formatted text.`, okText: "Save", danger: false })
    if (!ok) return

    btn.disabled = true
    // Copy right away, while the confirm click still counts as a user gesture.
    // Race with a timeout so a stalled clipboard call can never block the save.
    const copied = await Promise.race([copyFormatted(), new Promise(r => setTimeout(() => r(false), 1500))])
    setStatus("s-info", `⏳ Saving ${label} to calendar...`)
    try {
      const results = await syncToFirestore(tasks)
      const okN = results.filter(r => r.ok).length, fail = results.filter(r => !r.ok).length
      if (fail > 0) setStatus("s-error", `⚠️ Saved ${okN}/${tasks.length} — ${fail} failed.`)
      else          setStatus("s-success", `✅ Saved ${label} to the calendar!${copied ? " 📋 Text copied." : ""}`)
    } catch(e) {
      setStatus("s-error", "❌ Failed: " + e.message)
    } finally { btn.disabled = false }
  }

  // ── Boot ──────────────────────────────────────────────────────
  const today = new Date().toISOString().split("T")[0]
  document.getElementById("fmtDate").value = today
  setSaveIndicator("saved")

  const draft = loadDraft()
  if (draft) restoreDraft(draft)
  else { addSection(); updatePreview() }

} // end initApp
</script>
</body>
