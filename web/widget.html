<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TAS — Widget</title>
  <link rel="icon" href="TASLogo.png">
  <!--
    Compact home-screen widget card.

    Deliberately NOT a Firebase-SDK page: a widget host reloads this on a
    timer and every kilobyte is a cold start, so it talks to the Firestore
    REST API with plain fetch instead. Everything is inline for the same
    reason — one request, no module graph.

    Query params
      u        the owner's uid (required) — from Tools → Phone widget
      n        max rows to draw (default: as many as fit the box)
      theme    dark | light   (default dark)
      compact  1 to drop the header, for very small widget boxes
      preview  1 to make the card inert — used by the Tools preview iframe,
               which shouldn't open the calendar every time it's clicked

    Reads two public things: the shared `tasks` collection, and this
    person's opt-in widgetFeed/{uid} doc (their ticked-off ids + personal
    tasks). Everything else — what's due, how soon, the colours — is worked
    out here, so a class task posted five minutes ago still shows up.

    Only shows work that is still ahead of its due date. Once a date has
    passed the feed cannot tell handed-in from forgotten, so overdue work
    belongs to the calendar's archive rather than to a glanceable card.
  -->
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    *{scrollbar-width:none;-ms-overflow-style:none}
    *::-webkit-scrollbar{display:none}

    :root{
      --bg1:#1c2f56; --bg2:#182848; --bg3:#0d1526;
      --card:rgba(255,255,255,0.06);
      --brd:rgba(255,255,255,0.12);
      --track:rgba(255,255,255,0.20);
      --text:#fff;
      --muted:rgba(255,255,255,0.55);
      --faint:rgba(255,255,255,0.38);
      --pink:#ff4fa3;
    }
    html[data-theme="light"]{
      --bg1:#ffffff; --bg2:#fdf4f9; --bg3:#ffe3f1;
      --card:rgba(0,0,0,0.035);
      --brd:rgba(0,0,0,0.10);
      --track:rgba(0,0,0,0.13);
      --text:#16233d;
      --muted:rgba(22,35,61,0.6);
      --faint:rgba(22,35,61,0.42);
    }

    /* Everything below is sized in rem, so the whole widget scales together
       from this one number. A widget host decides the box; how big the CSS
       pixel is inside it varies wildly between phones and host apps, so the
       ?scale= parameter is the escape hatch when it comes out too small. */
    html{ font-size:calc(16px * var(--s, 1.15)) }
    html,body{height:100%}
    body{
      font-family:'Kanit','Prompt',system-ui,-apple-system,'Segoe UI',sans-serif;
      color:var(--text);
      background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%);
      display:flex; flex-direction:column;
      padding:0.75rem 0.8125rem;
      overflow:hidden;
      /* A widget box is whatever size the host gives it — never scroll, clip. */
    }

    /* ── Header ─────────────────────────────────────────────── */
    .wg-head{
      display:flex; align-items:center; gap:0.375rem;
      margin-bottom:0.5rem; flex-shrink:0;
    }
    .wg-logo{
      width:1.125rem; height:1.125rem; object-fit:contain; display:block; flex-shrink:0;
      filter:drop-shadow(0 0 6px rgba(255,79,163,0.35));
    }
    .wg-mark{
      font-size:0.85rem; font-weight:700; letter-spacing:.14em;
      color:var(--pink); line-height:1;
    }
    .wg-sum{
      font-size:0.68rem; font-weight:400; color:var(--muted);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      border-left:1px solid var(--brd); margin-left:0.125rem;
      padding-left:0.5rem;
    }
    /* Last-updated stamp. An icon rather than a bare time, so it reads as
       "this is when the data is from" instead of a clock. */
    .wg-time{
      margin-left:auto; display:inline-flex; align-items:center; gap:0.2rem;
      font-size:0.6rem; font-weight:400; color:var(--faint);
      font-variant-numeric:tabular-nums; white-space:nowrap;
    }
    .wg-time svg{width:0.6rem; height:0.6rem; flex-shrink:0; display:block}
    .wg-time.stale{color:#ffb4a8}
    body.compact .wg-head{display:none}

    /* Watermark — brand presence that costs no rows. Same file as the
       header mark, so it's already in cache by the time it paints. */
    .wg-watermark{
      position:fixed; right:-0.9rem; bottom:-1rem;
      width:6rem; height:6rem; object-fit:contain;
      opacity:0.07; pointer-events:none; z-index:0;
    }
    .wg-head, .wg-list{position:relative; z-index:1}
    /* Fainter on a short box, where it would otherwise sit right behind a row */
    @media (max-height:200px){ .wg-watermark{width:4.4rem;height:4.4rem;right:-0.75rem;bottom:-0.9rem;opacity:0.045} }

    /* ── Rows ───────────────────────────────────────────────── */
    .wg-list{display:flex; flex-direction:column; gap:0.3rem; min-height:0; flex:1; overflow:hidden}
    .wg-group{
      font-size:0.55rem; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
      color:var(--faint); margin-top:0.125rem;
    }
    .wg-group:first-child{margin-top:0}

    .wg-row{
      display:flex; align-items:center; gap:0.5rem;
      background:var(--card); border:1px solid var(--brd);
      border-radius:0.625rem; padding:0.44rem 0.56rem;
      min-width:0;
    }
    .wg-dot{width:0.44rem; height:0.44rem; border-radius:50%; flex-shrink:0}
    /* These are spans (a row is one flat line of markup) so they need an
       explicit block, or the subject runs on after the task name. */
    .wg-main{min-width:0; flex:1; display:block}
    /* Progress: a hairline under the subject, so a started task reads as
       started from across the room without costing a row of height. */
    .wg-prog{display:block; height:0.25rem; border-radius:99px; background:var(--track); margin-top:0.22rem; overflow:hidden}
    .wg-prog-fill{display:block; height:100%; border-radius:99px; min-width:0.25rem}
    .wg-name{
      display:block;
      font-size:0.78rem; font-weight:500; line-height:1.25;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .wg-sub{
      display:block;
      font-size:0.58rem; font-weight:300; color:var(--muted);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .wg-when{
      font-size:0.68rem; font-weight:600; flex-shrink:0;
      font-variant-numeric:tabular-nums; text-align:right;
    }
    .wg-more{font-size:0.6rem; color:var(--faint); text-align:center; padding-top:0.125rem}

    /* ── Mini calendar ────────────────────────────────────────
       A tall widget box with one task in it was 60% empty navy. The rows
       always win the space; whatever they leave goes to as many weeks of
       calendar as will fit, and the grid stretches into the rest — a
       calendar cell is meant to be a box, so growing one looks deliberate
       where a stretched task row just looks broken. Nothing to show it on
       a short box, where the fit test drops it entirely. */
    .wg-cal{
      flex:1 1 auto; display:flex; flex-direction:column;
      padding-top:0.44rem; margin-top:0.44rem;
      border-top:1px solid var(--brd);
    }
    .wg-cal-head{
      display:grid; grid-template-columns:repeat(7,1fr);
      font-size:0.5rem; font-weight:700; letter-spacing:.06em;
      color:var(--faint); text-align:center; margin-bottom:0.19rem;
    }
    /* minmax keeps a floor under each row, so a grid that genuinely can't
       fit overflows and the fit test below can see it. Without the floor
       flex would just squash it and every size would "fit". */
    /* The cap stops a near-empty month ballooning into giant cells on a
       tall box — past a point a calendar cell is just a bigger hole. */
    .wg-cal-grid{
      flex:1; display:grid; grid-template-columns:repeat(7,1fr);
      grid-auto-rows:minmax(1.55rem,2.3rem); gap:0.13rem;
    }
    .wg-day{
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:0.11rem; border-radius:0.44rem; min-width:0; overflow:hidden;
    }
    .wg-day.today{background:var(--card); box-shadow:inset 0 0 0 1px var(--brd)}
    .wg-dnum{font-size:0.66rem; font-weight:500; line-height:1; font-variant-numeric:tabular-nums}
    .wg-day.past .wg-dnum{color:var(--faint); font-weight:300}
    .wg-day.free .wg-dnum{color:var(--muted); font-weight:400}
    .wg-day.today .wg-dnum{color:var(--pink); font-weight:700}
    /* Fixed height whether or not a day has dots, so the numbers line up */
    .wg-dots{display:flex; gap:0.11rem; height:0.25rem; align-items:center}
    .wg-dots i{width:0.25rem; height:0.25rem; border-radius:50%; display:block}

    /* ── Empty / error ──────────────────────────────────────── */
    .wg-state{
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:0.3rem;
      text-align:center; padding:0.5rem;
    }
    .wg-state-big{font-size:0.95rem; font-weight:600}
    .wg-state-sub{font-size:0.68rem; font-weight:300; color:var(--muted); line-height:1.5}

    /* ── Short boxes ──────────────────────────────────────────
       A small or medium home-screen widget is only ~170px tall. At that
       height the subject line and the group heading cost a whole extra
       row each, and one more task is worth more than either — the dot
       colour already says how soon each one is due. */
    @media (max-height:200px){
      .wg-head{margin-bottom:0.375rem}
      .wg-list{gap:0.25rem}
      .wg-group{display:none}
      .wg-sub{display:none}
      .wg-row{padding:0.32rem 0.5rem}
    }

    /* ── Tap target ───────────────────────────────────────────
       The whole card opens the calendar. It's one invisible anchor over
       everything rather than a link per row: a widget box is small, a
       thumb is not, and there is nothing else here to tap. Kept out of
       the preview iframe, which would otherwise open a tab per click. */
    .wg-tap{
      position:fixed; inset:0; z-index:5; display:block;
      -webkit-tap-highlight-color:transparent;
    }
    .wg-tap:active{background:rgba(255,255,255,0.06)}
    html[data-theme="light"] .wg-tap:active{background:rgba(0,0,0,0.04)}
    body.preview .wg-tap{display:none}

    /* ── Loading skeleton — a widget that flashes "nothing due"
         before its data lands is worse than one that says nothing ── */
    .sk{
      height:1.94rem; border-radius:0.625rem;
      background:linear-gradient(90deg,var(--card) 25%,rgba(255,255,255,0.14) 37%,var(--card) 63%);
      background-size:400% 100%; animation:sh 1.3s ease infinite;
    }
    @keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
    @media (prefers-reduced-motion:reduce){ .sk{animation:none} }
  </style>
</head>
<body>

<a class="wg-tap" id="wgTap" href="calendar.html" target="_blank" rel="noopener"
   aria-label="Open the TAS calendar"></a>

<img class="wg-watermark" id="wgWatermark" src="TASLogoLIGHT.png" alt="" aria-hidden="true">

<div class="wg-head">
  <img class="wg-logo" id="wgLogo" src="TASLogoLIGHT.png" alt="3/3 Academic System">
  <span class="wg-mark">TAS</span>
  <span class="wg-sum" id="wgSum"></span>
  <span class="wg-time" id="wgTime">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>
    <span id="wgTimeText"></span>
  </span>
</div>

<div class="wg-list" id="wgList">
  <div class="sk"></div>
  <div class="sk" style="animation-delay:.12s"></div>
  <div class="sk" style="animation-delay:.24s"></div>
</div>

<script>
(function(){
  "use strict"

  var PROJECT = "tas-samtabsam"
  var API_KEY = "AIzaSyA7jTnrA4qvIyqJRec3LYRgkIpJ4lKqX18"
  var BASE = "https://firestore.googleapis.com/v1/projects/" + PROJECT +
             "/databases/(default)/documents"

  var DAY = 864e5
  var ZONE_DEFAULTS = { red:3, orange:7, yellow:14 }

  // Read budget. Firestore bills one read per document returned, and this
  // page runs on every phone in the class at once, so the polling interval
  // is multiplied by however many widgets exist. At five minutes a single
  // widget spent ~288 full task-list reads a day and the project's daily
  // quota ran out — every read in the app then fails, calendar included.
  // Half-hourly is still fresher than a home-screen glance needs.
  var POLL_MS = 30 * 60 * 1000
  // A widget host fires visibilitychange every time the home screen comes
  // back, which on a phone is constantly. Coming into view is worth a
  // refresh, but not one per glance.
  var MIN_REFETCH_MS = 10 * 60 * 1000
  // Nothing behind today is drawn any more, so nothing behind today needs
  // to be read. Everything older stays unread and unbilled.
  var QUERY_LIMIT = 40
  // Markers and estimated dates aren't handed in. Live docs still carry the
  // older "estimated" spelling of "prediction", so both are excluded.
  var NOT_SUBMITTABLE = ["marker", "prediction", "estimated"]

  var params  = new URLSearchParams(location.search)
  var uid     = (params.get("u") || "").trim()
  // Without ?n the card draws as many rows as it has, and fitRows() below
  // trims back to whatever the host's box can actually hold. A fixed six
  // left a tall Android widget two-thirds empty.
  var FILL_ROWS = 20
  var maxRows = Math.max(1, Math.min(FILL_ROWS, parseInt(params.get("n"), 10) || FILL_ROWS))
  var theme   = params.get("theme") === "light" ? "light" : "dark"
  // Text size. Everything is in rem off one root font-size, so this scales
  // the whole card — rows, padding, logo and all — not just the type.
  var scale = parseFloat(params.get("scale"))
  if (isFinite(scale) && scale > 0) {
    document.documentElement.style.setProperty("--s", Math.max(0.7, Math.min(2.5, scale)))
  }
  document.documentElement.dataset.theme = theme
  // The LIGHT file is the logo *for* dark backgrounds, so the light theme
  // needs the other one — same swap setTheme() does in the calendar.
  if (theme === "light") {
    document.getElementById("wgLogo").src = "TASLogo.png"
    document.getElementById("wgWatermark").src = "TASLogo.png"
  }
  if (params.get("compact") === "1") document.body.classList.add("compact")
  if (params.get("preview") === "1") document.body.classList.add("preview")

  // ── Tap opens the calendar ──────────────────────────────────
  // The href has to be absolute: an Android webpage-widget app hands the
  // URL to the system browser, and a relative one resolves against
  // whatever that app thinks the current page is — usually nothing.
  var tap = document.getElementById("wgTap")
  var calUrl = new URL("calendar.html", location.href).href
  tap.href = calUrl
  // target=_blank is what a well-behaved host picks up. The ones that
  // swallow it leave the click to us, so try to open a real browser tab
  // and fall back to navigating the widget's own view.
  tap.addEventListener("click", function(e){
    if (e.defaultPrevented) return
    var win = null
    try { win = window.open(calUrl, "_blank", "noopener") } catch(err){}
    if (win) { e.preventDefault(); return }
    // No window came back — the host blocked it. Let the anchor's own
    // navigation happen rather than trapping the reader in the widget.
    try { if (window.top !== window.self) return } catch(err){}
    e.preventDefault()
    location.href = calUrl
  })

  var CACHE_KEY = "tas_widget_cache_" + uid

  // ── Firestore REST unwrapping ───────────────────────────────
  function val(v){
    if (v == null) return null
    if ("stringValue"    in v) return v.stringValue
    if ("integerValue"   in v) return Number(v.integerValue)
    if ("doubleValue"    in v) return v.doubleValue
    if ("booleanValue"   in v) return v.booleanValue
    if ("timestampValue" in v) return v.timestampValue
    if ("nullValue"      in v) return null
    if ("arrayValue"     in v) return (v.arrayValue.values || []).map(val)
    if ("mapValue"       in v) return unwrap(v.mapValue.fields || {})
    return null
  }
  function unwrap(fields){
    var o = {}
    for (var k in fields) o[k] = val(fields[k])
    return o
  }
  function idOf(name){ return String(name || "").split("/").pop() }

  // The collection read pulled every task ever posted, archive included,
  // and paid for each one. A range query on `end` returns only what the
  // card can actually show. It's a single-field range, so the automatic
  // index covers it — no composite index to deploy.
  //
  // If it fails for any reason the old read still works, and a widget that
  // costs too much is better than a widget that shows nothing.
  function fetchTasks(){
    var body = {
      structuredQuery: {
        from: [{ collectionId: "tasks" }],
        where: { fieldFilter: {
          field: { fieldPath: "end" },
          op: "GREATER_THAN_OR_EQUAL",
          value: { stringValue: ymd(today()) }
        } },
        orderBy: [{ field: { fieldPath: "end" }, direction: "ASCENDING" }],
        limit: QUERY_LIMIT
      }
    }
    return fetch(BASE + ":runQuery?key=" + API_KEY, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
      cache: "no-store"
    }).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status)
      return r.json()
    }).then(function(rows){
      return (rows || []).filter(function(r){ return r.document })
                         .map(function(r){ return r.document })
    }).catch(function(err){
      console.warn("Range query failed, falling back to the full read:", err)
      return getJSON(BASE + "/tasks?key=" + API_KEY + "&pageSize=300")
        .then(function(res){ return res.documents || [] })
    })
  }

  function getJSON(url){
    return fetch(url, { cache:"no-store" }).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status)
      return r.json()
    })
  }

  // ── Dates ───────────────────────────────────────────────────
  function today(){ var d = new Date(); d.setHours(0,0,0,0); return d }
  function parseDate(s){ return new Date(s + "T00:00:00") }
  function daysLeft(t, s){ return Math.round((parseDate(s) - t) / DAY) }

  function whenLabel(dl){
    if (dl === 0) return "Today"
    if (dl === 1) return "Tomorrow"
    if (dl < 7)  return dl + " days"
    return dl + "d"
  }

  // dl < 0 only reaches here from the mini calendar's past days, which
  // never carry a dot — nothing overdue is drawn any more.
  function urgencyColor(dl, z){
    if (dl <= z.red)     return "#ef4444"
    if (dl <= z.orange)  return "#f97316"
    if (dl <= z.yellow)  return "#f59e0b"
    if (dl <= Math.max(30, z.yellow + 1)) return "#84cc16"
    return "#1D9E75"
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
    })
  }

  // ── Render ──────────────────────────────────────────────────
  function showState(big, sub){
    document.getElementById("wgList").innerHTML =
      '<div class="wg-state"><div class="wg-state-big">' + esc(big) + '</div>' +
      (sub ? '<div class="wg-state-sub">' + esc(sub) + '</div>' : '') + '</div>'
  }

  function render(data){
    var t = today()
    var z = Object.assign({}, ZONE_DEFAULTS, data.zones || {})
    var doneSet = {}
    ;(data.done || []).forEach(function(id){ doneSet[id] = true })
    var prog = data.progress || {}

    // The widget is a "what's coming" card, nothing else. A past due date
    // does not mean the work is outstanding — it may have been handed in on
    // paper, or in person, or the date may just have moved — and the feed
    // has no way to tell. Guessing produced a red "3d late" for work that
    // was already done, so overdue tasks are left to the calendar's archive,
    // which is the one place that can show them with their full history.
    var all = (data.tasks || []).concat(data.personal || [])
    var upcoming = all.filter(function(x){
      if (!x.end || NOT_SUBMITTABLE.indexOf(x.type) !== -1) return false
      if (doneSet[x.id]) return false
      return daysLeft(t, x.end) >= 0
    }).sort(function(a,b){ return parseDate(a.end) - parseDate(b.end) })
    var live = upcoming

    // Summary line — the one thing readable at a glance from across a room
    var sumParts = []
    var dueToday = upcoming.filter(function(x){ return daysLeft(t, x.end) === 0 }).length
    if (dueToday) sumParts.push(dueToday + " due today")
    if (!sumParts.length) sumParts.push(upcoming.length ? upcoming.length + " coming up" : "nothing due")
    // Without the feed doc this is just the public class list — it can't
    // subtract what you've ticked off, and that's worth admitting.
    if (data.noFeed) sumParts.push("not linked")
    document.getElementById("wgSum").textContent = sumParts.join(" · ")

    var d = new Date(data.fetchedAt || Date.now())
    document.getElementById("wgTimeText").textContent =
      String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0")
    document.getElementById("wgTime").classList.toggle("stale", !!data.stale)
    document.getElementById("wgTime").title =
      (data.stale ? "Couldn't reach TAS — showing the last data from " : "Last updated ") + d.toLocaleString()

    if (!live.length){
      showState("All clear ✓", hasAnyTasks(data) ? "Nothing coming up." : "No tasks on the calendar.")
      return
    }

    var html = ""
    var shown = 0

    function rows(list){
      for (var i = 0; i < list.length && shown < maxRows; i++, shown++){
        var x = list[i]
        var dl = daysLeft(t, x.end)
        var pc = prog[x.id] || 0
        html += '<div class="wg-row">' +
                  '<span class="wg-dot" style="background:' + urgencyColor(dl, z) + '"></span>' +
                  '<span class="wg-main">' +
                    '<span class="wg-name">' + esc(x.name || "Untitled") + '</span>' +
                    '<span class="wg-sub">' + esc(x.subject || "") +
                      (x.personal ? " · mine" : "") +
                      (pc ? " · " + pc + "%" : "") + '</span>' +
                    (pc ? '<span class="wg-prog"><span class="wg-prog-fill" style="width:' + pc +
                          '%;background:' + urgencyColor(dl, z) + '"></span></span>' : "") +
                  '</span>' +
                  '<span class="wg-when">' + esc(whenLabel(dl)) + '</span>' +
                '</div>'
      }
    }

    if (upcoming.length){
      html += '<div class="wg-group">Due next</div>'
      rows(upcoming)
    }
    document.getElementById("wgList").innerHTML = html
    fitRows(live.length)
    fillCalendar(live, z)
  }

  // ── Mini calendar ───────────────────────────────────────────
  // Only ever drawn into space the rows didn't want. Build the biggest
  // one, measure, and step down a week at a time until it fits — cheaper
  // and more honest than predicting row heights in a box whose size and
  // text scale are both someone else's decision.
  var WD = ["S","M","T","W","T","F","S"]
  var MAX_WEEKS = 5

  function ymd(d){
    return d.getFullYear() + "-" +
           String(d.getMonth() + 1).padStart(2, "0") + "-" +
           String(d.getDate()).padStart(2, "0")
  }

  function buildCalendar(start, weeks, byDate, t, z){
    var head = ""
    for (var w = 0; w < 7; w++) head += "<span>" + WD[w] + "</span>"

    var cells = ""
    for (var i = 0; i < weeks * 7; i++){
      var d = new Date(start.getTime() + i * DAY)
      var due = byDate[ymd(d)] || []
      var dl = Math.round((d - t) / DAY)
      var cls = dl === 0 ? "today" : dl < 0 ? "past" : due.length ? "" : "free"
      var dots = ""
      for (var j = 0; j < Math.min(3, due.length); j++){
        dots += '<i style="background:' + urgencyColor(dl, z) + '"></i>'
      }
      cells += '<span class="wg-day ' + cls + '">' +
                 '<span class="wg-dnum">' + d.getDate() + '</span>' +
                 '<span class="wg-dots">' + dots + '</span>' +
               '</span>'
    }

    var el = document.createElement("div")
    el.className = "wg-cal"
    el.innerHTML = '<div class="wg-cal-head">' + head + '</div>' +
                   '<div class="wg-cal-grid">' + cells + '</div>'
    return el
  }

  function fillCalendar(live, z){
    var list = document.getElementById("wgList")
    if (list.querySelector(".wg-state")) return

    var t = today()
    // Start on the Sunday of this week so the columns line up under the
    // weekday letters; the days already gone are drawn faint.
    var start = new Date(t.getTime() - t.getDay() * DAY)

    var byDate = {}
    live.forEach(function(x){ (byDate[x.end] = byDate[x.end] || []).push(x) })

    for (var weeks = MAX_WEEKS; weeks >= 1; weeks--){
      var el = buildCalendar(start, weeks, byDate, t, z)
      list.appendChild(el)
      if (list.scrollHeight <= list.clientHeight + 1) return
      el.remove()
    }
  }

  // The host decides the box and the reader decides the text size, so how
  // many rows actually fit can't be known up front — a half-drawn row at the
  // bottom looks broken. Drop whole rows from the end until the rest fit.
  function fitRows(total){
    var list = document.getElementById("wgList")
    var guard = 40
    while (list.scrollHeight > list.clientHeight + 1 && guard-- > 0) {
      var rows = list.querySelectorAll(".wg-row")
      if (rows.length <= 1) break              // always keep at least one
      var last = rows[rows.length - 1]
      var prev = last.previousElementSibling
      last.remove()
      // A heading left with nothing under it should go too.
      if (prev && prev.className.indexOf("wg-group") !== -1) prev.remove()
      updateMore(list, total)
    }
    updateMore(list, total)
  }

  function updateMore(list, total){
    var shown = list.querySelectorAll(".wg-row").length
    var hidden = total - shown
    var el = list.querySelector(".wg-more")
    if (hidden > 0) {
      if (!el) {
        el = document.createElement("div")
        el.className = "wg-more"
        list.appendChild(el)
      }
      el.textContent = "+" + hidden + " more"
    } else if (el) {
      el.remove()
    }
  }

  // Distinguishes "you're on top of everything" from "there is nothing here"
  function hasAnyTasks(data){ return (data.tasks || []).length > 0 }

  // ── Load ────────────────────────────────────────────────────
  function readCache(){
    try {
      var raw = localStorage.getItem(CACHE_KEY)
      return raw ? JSON.parse(raw) : null
    } catch(e){ return null }
  }
  function writeCache(data){
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)) } catch(e){}
  }

  var lastFetchAt = 0

  function load(){
    if (!uid){
      showState("Not set up yet", "Open TAS → Tools → Phone widget and use the link it gives you.")
      return
    }

    // Too soon since the last one: redraw what we already have instead of
    // paying for the same answer again. Dates are recomputed on every
    // render, so a cached list still counts down correctly.
    if (lastFetchAt && Date.now() - lastFetchAt < MIN_REFETCH_MS){
      var c = readCache()
      if (c) { render(c); return }
    }
    lastFetchAt = Date.now()

    Promise.all([
      // Shared class tasks are public by rule, so this needs no sign-in.
      fetchTasks(),
      // The owner's opt-in feed: ticked-off ids + personal tasks.
      getJSON(BASE + "/widgetFeed/" + encodeURIComponent(uid) + "?key=" + API_KEY)
        .catch(function(){ return null })
    ]).then(function(res){
      var taskDocs = res[0] || []
      var feed = res[1] ? unwrap(res[1].fields || {}) : {}

      var data = {
        fetchedAt: Date.now(),
        zones: feed.zones || null,
        done: feed.done || [],
        progress: feed.progress || {},
        tasks: taskDocs.map(function(d){
          var f = unwrap(d.fields || {})
          f.id = idOf(d.name)
          return f
        }),
        personal: (feed.personal || []).map(function(p){
          p.personal = true
          return p
        })
      }

      if (!res[1]){
        // No feed doc — the widget still works, it just can't know what
        // this person has already ticked off or what's on their own list.
        data.noFeed = true
      }

      writeCache(data)
      render(data)
    }).catch(function(err){
      console.warn("Widget load failed:", err)
      // Don't let a failure hold the throttle open — the next glance
      // should be free to try again.
      lastFetchAt = 0
      var cached = readCache()
      if (cached){
        cached.stale = true
        render(cached)
      } else {
        showState("Can't reach TAS", "It'll retry on its own.")
      }
    })
  }

  load()
  // Widget hosts keep this page alive between refreshes; re-pull on a timer
  // and whenever the widget comes back into view.
  setInterval(load, POLL_MS)
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) load()
  })
  // Past midnight every "3 days" on screen is wrong by one, and whatever
  // was due today has dropped off the card entirely.
  setInterval(function(){
    var c = readCache()
    if (c) render(c)
  }, 60 * 1000)
})()
</script>
</body>
</html>
